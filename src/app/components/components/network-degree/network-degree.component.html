<div class="bkg">

    <div class="input-group">
        <app-native-search-field
            [selectedOption]="originActor"
            (optionSelected)="selectOrigin($event)">
        </app-native-search-field>
        <app-native-search-field
            [selectedOption]="destinyActor"
            (optionSelected)="selectDestiny($event)">
        </app-native-search-field>        
    </div>
    <div class="button-holder">
        <button class="btn" (click)="goToNetworkQuery()">Pesquisa BFS</button>
        <button class="btn" (click)="goToAllNetworkQuery()">Pesquisa BFS até 8</button>
    </div>
    

    <div *ngIf="isLoading" class="loading-indicator">
        Carregando...
    </div>

    <div *ngIf="isError" class="loading-indicator">
        {{errorMessage}}
    </div>

    <div *ngIf="showDialog">
        <app-row-result-dialog [data]="dialogData" (close)="closeDialog()"></app-row-result-dialog>
      </div>
    
    <div class="results">
        <div class="results" *ngIf="result">
            <div *ngFor="let item of resultKeys; let i = index" class="result-container">
                <div class="result-item">
                    <img [src]="result[item]" alt="{{ item }}"/>
                    <p>{{ item }}</p>
                </div>
                <div *ngIf="i !== resultKeys!.length - 1" class="result-line"></div>
            </div>
        </div>

        <div class="resultsAll" *ngIf="resultAll">
            <h3>Total de {{ resultAll.total }} caminhos com até 8 de distância entre {{ originActor }} e {{ destinyActor }}</h3>
            <table>
                <thead>
                    <tr>
                        <th>Posição</th>
                        <th>Resultado</th>
                        <th>Distância</th>
                    </tr>
                </thead>
                <tbody>
                    <tr *ngFor="let key of getKeys(resultAll.results); let i = index" (click)="getTableRow(key)">
                        <td>{{ i + 1 }}</td> <!-- Position starts from 1 -->
                        <td>{{ key }}</td>
                        <td>{{ resultAll.results[key] }}</td>
                    </tr>
                </tbody>
            </table>
        </div>
          
    </div>

</div>
